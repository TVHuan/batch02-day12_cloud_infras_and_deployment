events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    
    upstream agent_backend {
        server agent:8000;
    }

    server {
        listen 80;

        # Serve frontend UI
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Proxy API requests
        location /ask {
            proxy_pass http://agent_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://agent_backend;
        }

        location /ready {
            proxy_pass http://agent_backend;
        }
    }
}
