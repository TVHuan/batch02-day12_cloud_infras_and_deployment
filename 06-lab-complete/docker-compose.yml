version: '3.8'

services:
  agent:
    build: .
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=${AGENT_API_KEY:-secret}
      - LOG_LEVEL=INFO
      - RATE_LIMIT_PER_MINUTE=10
      - MONTHLY_BUDGET_USD=10
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - agent

volumes:
  redis_data:
